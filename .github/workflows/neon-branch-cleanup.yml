name: Neon Preview Branch Cleanup

# La integración Neon <-> Vercel crea una branch de base de datos
# (preview/<git-branch>) por cada preview deployment, pero NO la borra al
# cerrar el PR. En julio 2026 eso dejó 59 branches huérfanas vivas y se
# facturaron 47 branch-months extra = $70.61 (el plan Launch incluye 10).
#
# Este workflow cierra esa fuga por dos vías:
#   1. pull_request: closed -> borra la branch de ESE PR inmediatamente.
#   2. schedule semanal   -> barre cualquier branch preview/* que ya no
#      tenga un PR abierto (red de seguridad para lo que se escape:
#      previews creadas a mano, PRs cerrados antes de existir este
#      workflow, o fallos puntuales del paso 1).
#
# Setup (una sola vez):
#   1. Neon console -> Account settings -> API keys -> Create.
#      Debe ser una key de la organización "keko" con permiso sobre el
#      proyecto socialpro.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret.
#      Name: NEON_API_KEY   Value: <la key>
#
# Si el secret NO está configurado el workflow avisa y sale con éxito
# (warn-only), igual que vercel-deploy-hook.yml. Nunca bloquea un PR.
#
# NEON_PROJECT_ID no es un secreto: sin API key no da acceso a nada.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 4 * * 1'  # lunes 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neon-branch-cleanup
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: nameless-dew-49198678
  NEON_API: https://console.neon.tech/api/v2

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Neon credentials
        id: check
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::warning::NEON_API_KEY secret not configured. Preview branches will keep accumulating and being billed. See the header of this workflow for setup steps."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Neon branch for the closed PR
        if: steps.check.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          target="preview/${HEAD_REF}"
          echo "Looking for Neon branch: $target"
          branches=$(curl -sf -H "Authorization: Bearer $NEON_API_KEY" \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches")
          id=$(echo "$branches" | jq -r --arg n "$target" \
            '.branches[] | select(.name == $n) | .id')
          if [ -z "$id" ]; then
            echo "No Neon branch named $target — nothing to do."
            exit 0
          fi
          for b in $id; do
            echo "Deleting $b ($target)"
            curl -sf -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches/$b" > /dev/null
          done
          echo "✓ Deleted"

      - name: Sweep orphaned preview branches
        if: steps.check.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Ramas git con PR abierto -> sus branches de Neon se conservan.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json headRefName --jq '.[].headRefName' | sed 's|^|preview/|' \
            | sort -u > keep.txt
          echo "Branches con PR abierto (se conservan):"; cat keep.txt

          curl -sf -H "Authorization: Bearer $NEON_API_KEY" \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches" > branches.json

          # Solo preview/*: nunca toca production, vercel-dev ni branches
          # de desarrollo creadas a mano desde la consola.
          jq -r '.branches[] | select(.name | startswith("preview/")) |
                 [.id, .name] | @tsv' branches.json > preview.tsv

          deleted=0
          while IFS=$'\t' read -r id name; do
            if grep -qxF "$name" keep.txt; then
              continue
            fi
            echo "Deleting orphan $name ($id)"
            curl -sf -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches/$id" > /dev/null
            deleted=$((deleted + 1))
          done < preview.tsv

          total=$(wc -l < preview.tsv)
          echo "::notice::Neon sweep: $deleted branches huérfanas borradas de $total preview/*."
