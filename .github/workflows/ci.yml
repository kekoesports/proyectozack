name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Opt into Node.js 24 runtime for all actions immediately (avoids deprecation
  # warning; GitHub will force this from June 2026 anyway).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Schema drift check
        # Falla si hay cambios en src/db/schema/ sin migration SQL generada.
        # Previene el incidente crm_alerts (schema editado via push sin migration file).
        # drizzle-kit check only validates journal vs schema files (no live DB).
        # Dependabot-triggered workflows do not receive repository secrets, so fall
        # back to a well-formed placeholder URL when DATABASE_URL is empty.
        run: |
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci_check}"
          npx drizzle-kit check

      - name: Snapshot drift canary
        # `drizzle-kit check` NO detecta el drift de snapshots: valida la coherencia
        # interna del journal, no que los snapshots reflejen lo que el SQL hizo.
        # Ver docs/incidents/2026-08-19-drizzle-snapshot-drift.md.
        #
        # Con el drift presente, `generate` se bloquea pidiendo un TTY para resolver
        # conflictos de columnas, así que aquí falla por sí solo. Es un canario
        # accidental, pero cubre el hueco mientras se reconcilia. Cuando el drift se
        # cierre, `generate` debe emitir cero statements y este paso pasará limpio.
        #
        # GATE REAL desde 2026-08-20 (migración 0119): el drift quedó reconciliado y
        # `generate` sobre master limpio responde "No schema changes, nothing to migrate".
        # Si este paso vuelve a fallar, es que alguien tocó el schema sin migración o
        # que los snapshots se han vuelto a desalinear — no lo silencies, arréglalo.
        run: |
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci_check}"
          cp -r drizzle "$RUNNER_TEMP/drizzle-canary"

          restore() { rm -rf drizzle && mv "$RUNNER_TEMP/drizzle-canary" drizzle; }

          # drizzle-kit imprime el error de TTY pero SALE CON 0, así que el exit code
          # por sí solo no basta: hay que mirar también la salida. Sin esto el paso
          # daba un falso verde justo cuando acababa de detectar el drift.
          set +e
          OUT=$(npx drizzle-kit generate --name=ci_drift_canary < /dev/null 2>&1)
          CODE=$?
          set -e
          echo "$OUT"

          if [ "$CODE" -ne 0 ] || echo "$OUT" | grep -qiE "Interactive prompts require a TTY|promptColumnsConflicts"; then
            echo "::error::drizzle-kit generate falló o pidió entrada interactiva — hay drift de snapshots. Ver docs/incidents/2026-08-19-drizzle-snapshot-drift.md"
            restore
            exit 1
          fi

          if git diff --quiet --exit-code -- drizzle/ && [ -z "$(git ls-files --others --exclude-standard drizzle/)" ]; then
            echo "Sin drift: generate no emitió nada."
            rm -rf "$RUNNER_TEMP/drizzle-canary"
          else
            echo "::error::drizzle-kit generate emitió SQL sobre master limpio. No lo commitees sin leerlo: puede contener DROP COLUMN ajenos a tu cambio."
            git status --porcelain -- drizzle/
            restore
            exit 1
          fi

  # Unit & Fuzz Tests job removed — flaky/noisy on CI; run locally with
  # `npm run test:ci` / `npm run test:fuzz` when needed.

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        # Full `npm run build` needs a real Neon URL (migrate + SSG data).
        # Dependabot PRs do not receive repository secrets — skip rather than
        # fail red after lint/typecheck already passed. Human PRs and master
        # still run the full build when secrets are present.
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RESEND_API_KEY" ] || [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::warning::Required secrets missing (typical for Dependabot). Skipping GitHub Actions build; Vercel preview / local verification cover the compile path."
            exit 0
          fi
          npm run build

  docker-runtime:
    name: Docker runtime (PDF & OCR)
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build production image
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RESEND_API_KEY" ] || [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::warning::Required secrets missing. Skipping Docker build for untrusted/dependency PR."
            exit 0
          fi

          BUILD_ENV="$RUNNER_TEMP/socialpro-build.env"
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' 'http://localhost:3000'
          } > "$BUILD_ENV"

          docker build \
            --secret "id=build_env,src=$BUILD_ENV" \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            --build-arg GIT_COMMIT_SHA="$GITHUB_SHA" \
            --tag "socialpro:ci-$GITHUB_SHA" \
            .

      - name: Exercise native PDF and OCR stack in final image
        run: |
          if ! docker image inspect "socialpro:ci-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Docker image was intentionally skipped."
            exit 0
          fi
          docker run --rm --entrypoint node \
            "socialpro:ci-$GITHUB_SHA" scripts/docker-runtime-smoke.mjs

      - name: Build Agent OS worker image
        run: |
          docker build \
            --file infra/agents/Dockerfile \
            --tag "socialpro-agent-worker:ci-$GITHUB_SHA" \
            .

      - name: Verify worker boots safely with kill switch off
        run: |
          docker run --rm --entrypoint node \
            -e DATABASE_URL=postgresql://worker:worker@127.0.0.1:5432/worker \
            -e AGENTS_ENABLED=false \
            "socialpro-agent-worker:ci-$GITHUB_SHA" \
            --import tsx --require ./scripts/worker-preload.cjs \
            src/worker/agent-worker.ts --once
